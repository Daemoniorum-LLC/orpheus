[workspace]
members = [
    "crates/maestro-proto",
    "crates/maestro-audio-server",
    "crates/maestro-juce-bridge",
    "crates/maestro-desktop",
    "crates/maestro-audio-common"
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Maestro AI"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"

# gRPC & Protobuf
tonic = "0.10"
tonic-build = "0.10"
prost = "0.12"

# GUI
eframe = "0.25"
egui = "0.25"
egui_plot = "0.25"

# Audio
cpal = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# FFI
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
