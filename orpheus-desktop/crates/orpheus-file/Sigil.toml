# Sigil manifest for orpheus-file
#
# File format handling for Orpheus - .maestro, Guitar Pro, audio files.

[package]
name = "orpheus-file"
version = "0.1.0"
description = "File format handling for Orpheus - .maestro, Guitar Pro, audio files"

[features]
default = []
# Enable native file dialogs (requires GTK or portal on Linux)
dialogs = ["dep:rfd"]

[rust-dependencies]
# Internal crates
orpheus-core = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Audio files
hound = { workspace = true }
claxon = { workspace = true }

# MIDI files
midly = { workspace = true }

# File dialogs (optional - requires desktop environment)
rfd = { workspace = true, optional = true }

# Directories (for config/recent files)
dirs = "5.0"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Compression
flate2 = "1.0"
zip = "2.2"

# PDF export
printpdf = { workspace = true }

# XML parsing (for Guitar Pro)
quick-xml = "0.37"

# Utilities
chrono = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = "3"

[sigil]
# Source files (Sigil syntax)
sources = [
    # Root
    "src-sg/lib.sg",
    "src-sg/dialog.sg",
    "src-sg/project.sg",
    "src-sg/recent.sg",
    "src-sg/midi.sg",
    "src-sg/midi_import.sg",
    "src-sg/pdf.sg",

    # Audio handling
    "src-sg/audio/mod.sg",

    # Guitar Pro parsing
    "src-sg/guitar_pro/mod.sg",
    "src-sg/guitar_pro/types.sg",
    "src-sg/guitar_pro/bcfz.sg",
    "src-sg/guitar_pro/convert.sg",
    "src-sg/guitar_pro/gp5.sg",
    "src-sg/guitar_pro/gp7.sg",
]

# Evidentiality tracking enabled
evidentiality = true

# Rune annotations used
runes = ["derive", "test", "error", "ignore"]

[build]
# Transpile to Rust for compilation
target = "rust"
output-dir = "src"

[metadata]
# Migration tracking
migrated-from = "rust"
migration-date = "2026-02-11"
migration-tool = "sigil migrate --evidentiality"
line-count = 7168
file-count = 14
