[project]
name = "orpheus-ui"
version = "0.1.0"
edition = "2025"
sigil-version = "0.2.0"
description = "Orpheus music production UI components"
license = "MIT OR Apache-2.0"

# Single-crate workspace (required for sigil test to find tests/)
[workspace]
members = ["."]

# Binary target for the web application
[[bin]]
name = "orpheus"
path = "src-sg/main.sg"

[compile]
backend = "llvm"
target = "wasm32-unknown-unknown"

[compile.wasm]
opt-level = "z"
