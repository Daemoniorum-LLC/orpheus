[workspace]
resolver = "2"
members = [
    "crates/orpheus-app",
    "crates/orpheus-core",
    "crates/orpheus-ui",
    "crates/orpheus-audio",
    "crates/orpheus-midi",
    "crates/orpheus-file",
    "crates/orpheus-ai",
    "crates/orpheus-plugins",
    "crates/orpheus-export",
    "crates/orpheus-synth",
    "crates/orpheus-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Daemoniorum LLC"]
repository = "https://github.com/Daemoniorum-LLC/orpheus"
description = "Professional music production platform - Native desktop application"

[workspace.dependencies]
# Internal crates
orpheus-core = { path = "crates/orpheus-core" }
orpheus-ui = { path = "crates/orpheus-ui" }
orpheus-audio = { path = "crates/orpheus-audio" }
orpheus-midi = { path = "crates/orpheus-midi" }
orpheus-file = { path = "crates/orpheus-file" }
orpheus-ai = { path = "crates/orpheus-ai" }
orpheus-plugins = { path = "crates/orpheus-plugins" }
orpheus-export = { path = "crates/orpheus-export" }
orpheus-synth = { path = "crates/orpheus-synth" }
orpheus-e2e = { path = "crates/orpheus-e2e" }

# Daemoniorum Platform SDKs
platform-core = { path = "../../daemoniorum-platform/crates/platform-core" }
platform-events = { path = "../../daemoniorum-platform/crates/platform-events" }
platform-runtime = { path = "../../daemoniorum-platform/crates/platform-runtime" }
platform-tools = { path = "../../daemoniorum-platform/crates/platform-tools" }
platform-capabilities = { path = "../../daemoniorum-platform/crates/platform-capabilities" }

# Daemoniorum UI Components
daemoniorum-egui = { path = "../../nyx/daemoniorum-egui", features = ["basic-widgets", "advanced-widgets", "theming", "panel-system", "accessibility"] }

# Daemoniorum AI/Agent SDK
daemoniorum-agent-sdk = { path = "../../nyx/daemoniorum-agent-sdk" }

# Aether Engine Components (audio, input, animation)
aether-audio = { path = "../../aether/aether-framework/aether-engine/engine/aether-audio" }
aether-input = { path = "../../aether/aether-framework/aether-engine/engine/aether-input" }
aether-animation = { path = "../../aether/aether-framework/aether-engine/engine/aether-animation" }
aether-core = { path = "../../aether/aether-framework/aether-engine/engine/aether-core" }

# Infernum LLM (for local AI)
infernum-core = { path = "../../nyx/infernum/infernum-complete/crates/infernum-core" }
grimoire-loader = { path = "../../nyx/infernum/infernum-complete/crates/grimoire-loader" }

# UI Framework
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
egui_dock = "0.14"

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# gRPC
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rand = "0.8"

# Audio
hound = "3.5"
claxon = "0.4"           # FLAC decoder (pure Rust)
flacenc = "0.4"          # FLAC encoder (pure Rust)
cpal = "0.15"            # Cross-platform audio I/O

# MIDI
midly = "0.5"
midir = "0.10"

# File dialogs (use xdg-portal on Linux to avoid GTK/Wayland deps)
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# Image loading
image = { version = "0.25", default-features = false, features = ["png"] }

# PDF generation
printpdf = "0.7"

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Testing
tempfile = "3.14"

# Compression
zstd = "0.13"

# Open files/folders in system default application
open = "5.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.release-debug]
inherits = "release"
debug = true
strip = false
