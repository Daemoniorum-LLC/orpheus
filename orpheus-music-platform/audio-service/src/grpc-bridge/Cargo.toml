[package]
name = "maestro-audio-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Daemoniorum LLC"]
description = "gRPC bridge for Maestro Audio Service (Sigil DSP backend)"
license = "MIT"

[dependencies]
# gRPC and Protocol Buffers
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Process management
async-process = "2.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
bytes = "1.7"
futures = "0.3"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "maestro-audio-service"
path = "src/main.rs"
