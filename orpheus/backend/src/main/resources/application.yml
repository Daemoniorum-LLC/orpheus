spring:
  application:
    name: maestro-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maestro}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Use Flyway for migrations
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: ${PORT:8080}
  compression:
    enabled: true

# AWS S3
aws:
  s3:
    bucket: ${S3_BUCKET:maestro-audio}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}  # For MinIO local dev

# Audio service (Rust gRPC)
audio:
  service:
    host: ${AUDIO_SERVICE_HOST:localhost}
    port: ${AUDIO_SERVICE_PORT:50051}

# Leviathan AI
leviathan:
  url: ${LEVIATHAN_URL:http://localhost:8081}
  api-key: ${LEVIATHAN_API_KEY:}

# JWT
jwt:
  secret: ${JWT_SECRET:changeme-in-production-use-env-var}
  expiration: 86400000  # 24 hours in ms

# Logging
logging:
  level:
    ai.maestro: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO
    org.hibernate: WARN

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method

# Application Configuration
app:
  # Development authentication bypass
  # WARNING: Setting this to true disables ALL authentication!
  # NEVER enable in production - use only for local development
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:false}  # Disabled by default for security
