<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <!-- Emerald green gradient for the lyre -->
    <linearGradient id="lyreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4a8"/>
      <stop offset="50%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#2dd4a8"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Lyre body -->
  <g filter="url(#glow)">
    <!-- Left flame arm -->
    <path d="M120 300
             Q100 250 105 200
             Q110 150 130 120
             Q140 100 145 90
             Q150 70 155 50
             Q158 40 162 50
             Q165 60 163 75
             Q160 100 165 120
             Q175 160 180 200
             Q185 230 180 260
             Q178 280 175 300"
          fill="url(#lyreGradient)"/>

    <!-- Left outer flame detail -->
    <path d="M105 280
             Q85 230 88 180
             Q92 130 110 95
             Q120 75 125 55
             Q128 40 132 30
             Q136 20 140 30
             Q143 40 140 55
             Q135 80 140 100
             Q150 140 148 180
             Q145 220 140 260"
          fill="url(#lyreGradient)" opacity="0.7"/>

    <!-- Right flame arm -->
    <path d="M280 300
             Q300 250 295 200
             Q290 150 270 120
             Q260 100 255 90
             Q250 70 245 50
             Q242 40 238 50
             Q235 60 237 75
             Q240 100 235 120
             Q225 160 220 200
             Q215 230 220 260
             Q222 280 225 300"
          fill="url(#lyreGradient)"/>

    <!-- Right outer flame detail -->
    <path d="M295 280
             Q315 230 312 180
             Q308 130 290 95
             Q280 75 275 55
             Q272 40 268 30
             Q264 20 260 30
             Q257 40 260 55
             Q265 80 260 100
             Q250 140 252 180
             Q255 220 260 260"
          fill="url(#lyreGradient)" opacity="0.7"/>

    <!-- Center prongs (tuning pegs) -->
    <!-- Left prong -->
    <path d="M170 95 L170 40 Q170 30 175 25 Q180 20 185 25 Q190 30 185 40 L180 50 L180 95"
          fill="url(#lyreGradient)"/>

    <!-- Center prong -->
    <path d="M192 85 L192 30 Q192 15 200 10 Q208 15 208 30 L208 85"
          fill="url(#lyreGradient)"/>

    <!-- Right prong -->
    <path d="M230 95 L230 40 Q230 30 225 25 Q220 20 215 25 Q210 30 215 40 L220 50 L220 95"
          fill="url(#lyreGradient)"/>

    <!-- Crossbar at top -->
    <rect x="165" y="85" width="70" height="12" rx="3" fill="url(#lyreGradient)"/>

    <!-- Base/soundboard -->
    <path d="M150 300
             Q150 320 170 330
             Q190 340 200 340
             Q210 340 230 330
             Q250 320 250 300
             L250 290
             Q230 295 200 295
             Q170 295 150 290
             Z"
          fill="url(#lyreGradient)"/>

    <!-- Strings -->
    <line x1="175" y1="97" x2="175" y2="295" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    <line x1="200" y1="97" x2="200" y2="295" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    <line x1="225" y1="97" x2="225" y2="295" stroke="#10b981" stroke-width="2" opacity="0.6"/>

    <!-- Music note -->
    <g transform="translate(155, 140)">
      <!-- Note head -->
      <ellipse cx="20" cy="80" rx="15" ry="12" fill="url(#lyreGradient)" transform="rotate(-20, 20, 80)"/>
      <!-- Note stem -->
      <rect x="32" y="20" width="4" height="65" fill="url(#lyreGradient)"/>
      <!-- Note flag -->
      <path d="M36 20 Q55 30 50 50 Q48 60 36 55" fill="url(#lyreGradient)"/>
    </g>
  </g>

  <!-- ORPHEUS text -->
  <text x="200" y="430"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="58"
        font-weight="bold"
        fill="url(#textGradient)"
        text-anchor="middle"
        letter-spacing="8">ORPHEUS</text>
</svg>
